<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vivid Digital Nexus Inventory & POS System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vivid Digital Nexus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>VDN POS</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease;
    }

    #loading-indicator.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 14px;
      color: #93c5fd;
      margin-bottom: 28px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-left-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading-indicator">
    <div class="loader-card">
      <img src="vdn_logo.png" alt="VDN Logo" class="logo-img">
      <div class="brand-title">Vivid Digital Nexus</div>
      <div class="brand-sub">Inventory &amp; POS Management System</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }
    }

    // Hide loader once Flutter mounts or on window load with fallback
    const observer = new MutationObserver(function(mutations, obs) {
      for (let i = 0; i < mutations.length; i++) {
        const added = mutations[i].addedNodes;
        for (let j = 0; j < added.length; j++) {
          if (added[j].tagName) {
            const tag = added[j].tagName.toLowerCase();
            if (tag === 'flutter-view' || tag === 'flt-glass-pane' || tag === 'flt-scene-host' || tag === 'canvas') {
              removeLoader();
              obs.disconnect();
              return;
            }
          }
        }
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
